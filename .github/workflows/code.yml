name: code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: install just
        uses: extractions/setup-just@v4

      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: run lint
        run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: install just
        uses: extractions/setup-just@v4

      - name: run tests
        run: just test

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
